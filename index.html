<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>escritos</title>
<link rel="stylesheet" href="style.css">

<main>
  <h1>Writing</h1>
  <ul>
    {% assign writings = site.pages | where: "layout", "writing" | sort: "order" %}
    {% for writing in writings %}
      <li>
        <a href="{{ writing.url | relative_url }}">
          {{ writing.title }}
        </a>
      </li>
    {% endfor %}
  </ul>
</main>
</html>
